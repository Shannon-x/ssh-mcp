# ssh-mcp 专用账号的 sshd 限制。
#
# 由 bootstrap-hosts.sh 装到 /etc/ssh/sshd_config.d/10-claudeops.conf。
# __CLAUDEOPS_USER__ 和 __CONTROL_IP__ 是占位符，脚本安装时替换成 --user 和 --control-ip。
# 不要手工把真实 IP 写回仓库里的这份模板。
#
# 这里只有 Match 段，只影响这一个账号。你自己和其他账号的登录方式一个字都不变，
# 所以装上它不会把你锁在外面。全局加固（禁 root、禁密码）在 05-hardening.conf，单独开关。
#
# 需要主配置里有 `Include /etc/ssh/sshd_config.d/*.conf`（Debian/Ubuntu、RHEL 9 默认就有），
# 脚本会先检查。

# 第一段：不是从控制机来的连接，把这个账号的所有认证方式都关掉，等于直接拒绝。
# 必须放在第二段前面：sshd 对同一个关键字只取第一个匹配到的值。
Match User __CLAUDEOPS_USER__ Address *,!__CONTROL_IP__
    PubkeyAuthentication no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    HostbasedAuthentication no

# 第二段：从控制机来的连接，只认公钥，而且公钥只从 root 管理的文件里读。
# 账号自己的 ~/.ssh/authorized_keys 不生效，所以就算它能写自己的家目录，也加不了钥匙。
Match User __CLAUDEOPS_USER__
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    # 不做跳板：不转发端口、不转发 agent、不开隧道、不跑 ~/.ssh/rc。
    # 如果某台机器要给别的 profile 当 ProxyJump（ssh-mcp 的 via），那台单独放开
    # AllowTcpForwarding local 并用 PermitOpen 限定目标，不要改这份通用模板。
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    # PermitTTY 保持默认（允许）：ssh-mcp 的交互式会话工具要申请 pty。
