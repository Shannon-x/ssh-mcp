# 可选的全局加固：只在 bootstrap-hosts.sh 加了 --harden 时安装，
# 装到 /etc/ssh/sshd_config.d/05-hardening.conf。
#
# 和 10-claudeops.conf 不同，这一份影响这台机器上的每个账号：
# 装上之后 root 不能再 SSH 登录，任何人都不能用密码登录。
# 脚本在下面两种情况会拒绝安装，免得把你锁在外面：
#   - 你执行脚本时用的登录账号就是 root；
#   - 你的登录账号没有 authorized_keys（看起来是用密码登录的）。
# 安装后脚本会用一条全新的 SSH 连接验证你还能登录，失败就自动回滚。
#
# 文件名用 05 开头，是为了排在云镜像常见的 50-cloud-init.conf 前面：
# sshd 取第一个读到的值，排在后面的 PasswordAuthentication yes 就不会生效。
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
